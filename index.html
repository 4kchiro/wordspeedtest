<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일본어 학습</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --border: #e8e6e0;
    --text: #1a1917;
    --text-muted: #8a8780;
    --accent: #3d6b4f;
    --accent-light: #eaf2ed;
    --radius: 12px;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 48px 40px;
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 400px;
    text-align: center;
  }

  .logo {
    font-family: 'Noto Serif JP', serif;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 3px;
    margin-bottom: 4px;
  }

  .sub {
    font-size: 0.8rem;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    margin-bottom: 40px;
  }

  .menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s, background 0.15s;
    text-align: left;
  }

  .menu-item:hover {
    border-color: var(--accent);
    background: var(--accent-light);
  }

  .menu-item:hover .icon { color: var(--accent); }
  .menu-item:hover .arrow { color: var(--accent); }

  .icon {
    font-family: 'Noto Serif JP', serif;
    font-size: 1.4rem;
    color: var(--text-muted);
    flex-shrink: 0;
    width: 36px;
    text-align: center;
    transition: color 0.15s;
  }

  .label-wrap { flex: 1; }

  .label-main {
    font-size: 0.95rem;
    font-weight: 600;
    display: block;
    margin-bottom: 2px;
  }

  .label-sub {
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  .arrow {
    font-size: 0.85rem;
    color: var(--border);
    transition: color 0.15s;
  }

  .divider {
    width: 32px;
    height: 1px;
    background: var(--border);
    margin: 8px auto;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">日本語</div>
  <div class="sub">학습 모드를 선택하세요</div>

  <nav class="menu">
    <a class="menu-item" href="kanji.html">
      <span class="icon">漢</span>
      <span class="label-wrap">
        <span class="label-main">한자 음독</span>
        <span class="label-sub">한자의 읽는 법을 학습</span>
      </span>
      <span class="arrow">›</span>
    </a>

    <a class="menu-item" href="word.html">
      <span class="icon">語</span>
      <span class="label-wrap">
        <span class="label-main">한자 단어</span>
        <span class="label-sub">한자 단어 의미 학습</span>
      </span>
      <span class="arrow">›</span>
    </a>

    <a class="menu-item" href="voca.html">
      <span class="icon">問</span>
      <span class="label-wrap">
        <span class="label-main">어휘 문제</span>
        <span class="label-sub">빈칸·유사어·용법 퀴즈</span>
      </span>
      <span class="arrow">›</span>
    </a>
  </nav>
</div>
</body>
</html>
