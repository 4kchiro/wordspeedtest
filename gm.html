<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문법 문제 N3</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --border: #e8e6e0;
    --text: #1a1917;
    --text-muted: #8a8780;
    --accent: #3d6b4f;
    --accent-light: #eaf2ed;
    --danger: #c0392b;
    --danger-light: #fdf0ee;
    --badge-a-bg: #eaf2ed; --badge-a-fg: #3d6b4f;
    --badge-b-bg: #fef3c7; --badge-b-fg: #92400e;
    --timer-full: #3d6b4f;
    --timer-mid: #e67e22;
    --timer-low: #c0392b;
    --radius: 12px;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .screen { display: none; width: 100%; max-width: 580px; }
  .screen.active { display: block; }

  /* ── START ── */
  .start-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 48px 40px;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .start-card h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 1.45rem; font-weight: 700;
    letter-spacing: 1px; margin-bottom: 4px;
  }
  .start-card .subtitle {
    font-size: 0.78rem; color: var(--text-muted);
    letter-spacing: 0.5px; margin-bottom: 32px;
  }

  .section-label {
    font-size: 0.75rem; font-weight: 700; color: var(--text-muted);
    letter-spacing: 1.5px; text-align: left; margin-bottom: 10px; margin-top: 20px;
  }

  /* 유형 선택 */
  .type-select-group { display: flex; gap: 8px; margin-bottom: 4px; }
  .type-btn {
    flex: 1; padding: 14px 8px; border: 1.5px solid var(--border); border-radius: 8px;
    background: var(--bg); cursor: pointer; transition: all 0.15s;
    font-family: 'Noto Sans KR', sans-serif; text-align: center;
  }
  .type-btn:hover { border-color: var(--accent); }
  .type-btn.selected { border-color: var(--accent); background: var(--accent-light); }
  .type-btn .type-code {
    font-family: 'DM Mono', monospace; font-size: 1.1rem; font-weight: 700;
    color: var(--accent); display: block; margin-bottom: 4px;
  }
  .type-btn .type-desc { font-size: 0.68rem; color: var(--text-muted); line-height: 1.4; }
  .type-btn.selected .type-desc { color: var(--accent); }

  .input-group { text-align: left; margin-bottom: 12px; margin-top: 20px; }
  .input-group label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-muted); margin-bottom: 8px; }
  .input-group input[type="number"] {
    width: 100%; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 8px;
    font-size: 1rem; font-family: 'DM Mono', monospace; color: var(--text); background: var(--bg);
    outline: none; transition: border-color 0.15s;
  }
  .input-group input[type="number"]:focus { border-color: var(--accent); }

  .hint { font-size: 0.78rem; color: var(--text-muted); margin: 14px 0 22px; text-align: left; }
  .hint span { font-family: 'DM Mono', monospace; font-weight: 500; }

  .btn-start {
    width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none;
    border-radius: 8px; font-size: 0.95rem; font-weight: 600; font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer; transition: opacity 0.15s, transform 0.1s;
  }
  .btn-start:hover { opacity: 0.9; }
  .btn-start:active { transform: scale(0.99); }

  .back-link {
    display: block; text-align: center; margin-top: 20px;
    font-size: 0.78rem; color: var(--text-muted); text-decoration: none;
  }
  .back-link:hover { color: var(--accent); }

  /* ── QUIZ ── */
  .quiz-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .progress-text { font-family: 'DM Mono', monospace; font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
  .btn-pause {
    padding: 7px 16px; background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 0.85rem; font-weight: 600; font-family: 'Noto Sans KR', sans-serif;
    color: var(--text); cursor: pointer; transition: background 0.15s; min-width: 76px;
  }
  .btn-pause:hover { background: var(--border); }
  .btn-pause.paused { background: var(--accent); color: #fff; border-color: var(--accent); }

  .timer-bar-wrap { height: 5px; background: var(--border); border-radius: 99px; margin-bottom: 24px; overflow: hidden; }
  .timer-bar { height: 100%; border-radius: 99px; transition: width 0.1s linear, background 0.3s; background: var(--timer-full); }

  /* 유형 뱃지 */
  .question-type-badge {
    display: inline-block; font-size: 0.7rem; font-weight: 700; font-family: 'DM Mono', monospace;
    border-radius: 4px; padding: 2px 8px; letter-spacing: 1px; margin-bottom: 12px;
  }
  .question-type-badge.type-a { color: var(--badge-a-fg); background: var(--badge-a-bg); }
  .question-type-badge.type-b { color: var(--badge-b-fg); background: var(--badge-b-bg); }

  /* B유형 안내 문구 */
  .b-hint {
    font-size: 0.72rem; color: var(--badge-b-fg); background: var(--badge-b-bg);
    border-radius: 6px; padding: 6px 12px; margin-bottom: 12px;
    display: none; line-height: 1.5; text-align: center;
  }

  .word-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 32px 32px 24px; box-shadow: var(--shadow); margin-bottom: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  .question-text {
    font-family: 'Noto Serif JP', serif;
    font-size: 1.15rem; font-weight: 400; line-height: 2;
    letter-spacing: 0.3px; word-break: break-word; max-width: 100%;
    white-space: pre-wrap;
  }
  .timer-count { font-family: 'DM Mono', monospace; font-size: 0.8rem; color: var(--text-muted); margin-top: 14px; }

  .choices-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px;
  }
  .choice-btn {
    padding: 14px 16px; border: 1.5px solid var(--border); border-radius: 8px;
    background: var(--surface); cursor: pointer; text-align: left;
    font-family: 'Noto Serif JP', serif; font-size: 0.95rem;
    color: var(--text); transition: all 0.15s; display: flex; align-items: center; gap: 10px;
  }
  .choice-btn:hover { border-color: var(--accent); background: var(--accent-light); }
  .choice-btn:disabled { cursor: not-allowed; opacity: 0.7; }
  .choice-btn.selected-pending { border-color: var(--accent); background: var(--accent-light); }

  .choice-num {
    font-family: 'DM Mono', monospace; font-size: 0.75rem; font-weight: 700;
    color: var(--text-muted); flex-shrink: 0;
    width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center; transition: all 0.15s;
  }
  .choice-btn.selected-pending .choice-num { border-color: var(--accent); color: var(--accent); }

  .quiz-action-bar { display: flex; justify-content: flex-end; margin-top: 4px; }
  .btn-skip {
    padding: 11px 20px; background: var(--bg); color: var(--text-muted); border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 0.82rem; font-weight: 600; font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer; transition: background 0.15s;
  }
  .btn-skip:hover { background: var(--border); }

  /* ── PAUSE ── */
  .pause-overlay {
    display: none; position: fixed; inset: 0; background: rgba(247,246,243,0.88);
    backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px; text-align: center;
  }
  .pause-overlay.show { display: flex; }
  .pause-overlay h2 { font-size: 1.4rem; font-weight: 700; }
  .pause-overlay p { color: var(--text-muted); font-size: 0.875rem; }
  .btn-resume {
    padding: 13px 32px; background: var(--accent); color: #fff; border: none;
    border-radius: 8px; font-size: 0.95rem; font-weight: 600; font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer; transition: opacity 0.15s; margin-top: 8px;
  }
  .btn-resume:hover { opacity: 0.88; }

  /* ── RESULT ── */
  .result-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 40px; box-shadow: var(--shadow);
  }
  .result-summary { text-align: center; margin-bottom: 32px; }
  .result-summary h2 { font-size: 1.4rem; font-weight: 700; margin-bottom: 12px; }
  .score-display { display: inline-flex; align-items: baseline; gap: 4px; font-family: 'DM Mono', monospace; margin-bottom: 10px; }
  .score-num { font-size: 3rem; font-weight: 500; color: var(--accent); line-height: 1; }
  .score-total { font-size: 1.2rem; color: var(--text-muted); }
  .score-pct { font-family: 'DM Mono', monospace; font-size: 0.9rem; color: var(--text-muted); }

  .tab-bar { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
  .tab-btn {
    padding: 9px 20px; border: none; background: none; font-size: 0.85rem; font-weight: 600;
    font-family: 'Noto Sans KR', sans-serif; color: var(--text-muted); cursor: pointer;
    border-bottom: 2.5px solid transparent; margin-bottom: -2px; transition: color 0.15s, border-color 0.15s;
  }
  .tab-btn.tab-wrong.active { color: var(--danger); border-bottom-color: var(--danger); }
  .tab-btn.tab-correct.active { color: var(--accent); border-bottom-color: var(--accent); }

  .tab-panel { display: none; max-height: 420px; overflow-y: auto; margin-bottom: 24px; }
  .tab-panel.active { display: block; }

  .result-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }

  .wrong-item {
    padding: 14px 16px; border-radius: 8px; background: var(--danger-light); font-size: 0.83rem; line-height: 1.6;
  }
  .wrong-item-header { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
  .wrong-q-badge {
    font-family: 'DM Mono', monospace; font-size: 0.7rem; font-weight: 700;
    border-radius: 4px; padding: 1px 6px; flex-shrink: 0; margin-top: 2px;
  }
  .wrong-q-badge.type-a { color: var(--badge-a-fg); background: #d0e8da; }
  .wrong-q-badge.type-b { color: var(--badge-b-fg); background: #fde68a; }
  .wrong-q-num {
    font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--danger);
    background: #f9d6d2; border-radius: 4px; padding: 1px 6px; flex-shrink: 0; margin-top: 2px;
  }
  .wrong-q-text { font-family: 'Noto Serif JP', serif; font-size: 0.88rem; color: var(--text); line-height: 1.7; }
  .wrong-answers-row { display: flex; gap: 16px; font-size: 0.78rem; }
  .item-label { color: var(--text-muted); min-width: 40px; }
  .item-correct { color: var(--accent); font-weight: 600; }
  .item-mine { color: var(--danger); }
  .item-skipped { color: var(--text-muted); font-style: italic; }

  .correct-item {
    padding: 12px 16px; border-radius: 8px; background: var(--accent-light);
    display: flex; align-items: flex-start; gap: 10px;
  }
  .correct-q-badge {
    font-family: 'DM Mono', monospace; font-size: 0.7rem; font-weight: 700;
    border-radius: 4px; padding: 1px 6px; flex-shrink: 0; margin-top: 2px;
  }
  .correct-q-badge.type-a { color: var(--badge-a-fg); background: #d0e8da; }
  .correct-q-badge.type-b { color: var(--badge-b-fg); background: #fde68a; }
  .correct-detail { font-size: 0.82rem; }
  .correct-q-text { font-family: 'Noto Serif JP', serif; font-size: 0.88rem; line-height: 1.6; margin-bottom: 4px; }
  .correct-ans { color: var(--accent); font-weight: 600; }

  .empty-msg { font-size: 0.82rem; color: var(--text-muted); font-style: italic; padding: 6px 0; }

  .btn-restart {
    width: 100%; padding: 13px; background: var(--accent); color: #fff; border: none;
    border-radius: 8px; font-size: 0.9rem; font-weight: 600; font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer; transition: opacity 0.15s;
  }
  .btn-restart:hover { opacity: 0.88; }

  @media (max-width: 480px) {
    .start-card { padding: 32px 20px; }
    .word-card { padding: 24px 16px 20px; }
    .question-text { font-size: 1.05rem; }
    .result-card { padding: 28px 20px; }
    .choices-grid { grid-template-columns: 1fr; }
    .type-btn .type-desc { font-size: 0.63rem; }
  }
</style>
</head>
<body>

<!-- ── START ── -->
<div id="startScreen" class="screen active">
  <div class="start-card">
    <h1>文法 · N3 문법 문제</h1>
    <p class="subtitle">유형과 문제 수를 선택하고 시작하세요</p>

    <div class="section-label">문제 유형</div>
    <div class="type-select-group">
      <div class="type-btn selected" data-type="A" onclick="selectType('A')">
        <span class="type-code">A</span>
        <span class="type-desc">빈칸에 들어갈<br>표현 고르기</span>
      </div>
      <div class="type-btn" data-type="B" onclick="selectType('B')">
        <span class="type-code">B</span>
        <span class="type-desc">★ 위치에 올<br>조각 고르기</span>
      </div>
    </div>

    <div class="input-group">
      <label>풀 문제 수</label>
      <input type="number" id="countInput" min="1" value="10" placeholder="예: 10">
    </div>
    <div class="input-group">
      <label>문제당 제한 시간 (초) — 0 입력 시 무제한</label>
      <input type="number" id="timerInput" min="0" max="300" value="0" placeholder="0 = 무제한">
    </div>

    <p class="hint">선택된 유형의 문제 수: <span id="totalCount">0</span>개</p>
    <button class="btn-start" onclick="startQuiz()">시작하기</button>
    <a class="back-link" href="index.html">← 홈으로</a>
  </div>
</div>

<!-- ── QUIZ ── -->
<div id="quizScreen" class="screen">
  <div class="quiz-header">
    <span class="progress-text" id="progressText">1 / 10</span>
    <button class="btn-pause" id="pauseBtn" onclick="togglePause()">일시정지</button>
  </div>

  <div class="timer-bar-wrap" id="timerBarWrap" style="display:none">
    <div class="timer-bar" id="timerBar" style="width:100%"></div>
  </div>

  <div class="b-hint" id="bHint">
    보기의 조각들을 올바른 순서로 나열할 때<br><strong>★ 위치에 오는 것</strong>을 고르세요
  </div>

  <div class="word-card">
    <div class="question-type-badge" id="questionTypeBadge"></div>
    <div class="question-text" id="questionText"></div>
    <div class="timer-count" id="timerCount" style="display:none"></div>
  </div>

  <div class="choices-grid" id="choicesGrid">
    <button class="choice-btn" onclick="selectChoice(0)"><span class="choice-num">1</span><span class="choice-text"></span></button>
    <button class="choice-btn" onclick="selectChoice(1)"><span class="choice-num">2</span><span class="choice-text"></span></button>
    <button class="choice-btn" onclick="selectChoice(2)"><span class="choice-num">3</span><span class="choice-text"></span></button>
    <button class="choice-btn" onclick="selectChoice(3)"><span class="choice-num">4</span><span class="choice-text"></span></button>
  </div>

  <div class="quiz-action-bar">
    <button class="btn-skip" onclick="skipQuestion()">건너뛰기</button>
  </div>
</div>

<!-- ── PAUSE ── -->
<div class="pause-overlay" id="pauseOverlay">
  <h2>일시정지</h2>
  <p>퀴즈가 멈춰 있습니다</p>
  <button class="btn-resume" onclick="togglePause()">계속하기</button>
</div>

<!-- ── RESULT ── -->
<div id="resultScreen" class="screen">
  <div class="result-card">
    <div class="result-summary">
      <h2>결과</h2>
      <div class="score-display">
        <span class="score-num" id="scoreNum">0</span>
        <span class="score-total" id="scoreTotal">/ 0</span>
      </div>
      <div class="score-pct" id="scorePct"></div>
    </div>

    <div class="tab-bar">
      <button class="tab-btn tab-wrong active" id="tabWrongBtn" onclick="switchTab('wrong')">오답 <span id="wrongCount"></span></button>
      <button class="tab-btn tab-correct" id="tabCorrectBtn" onclick="switchTab('correct')">정답 <span id="correctCount"></span></button>
    </div>

    <div class="tab-panel active" id="panelWrong">
      <ul class="result-list" id="wrongList"></ul>
    </div>
    <div class="tab-panel" id="panelCorrect">
      <ul class="result-list" id="correctList"></ul>
    </div>

    <button class="btn-restart" onclick="restart()">다시 시작</button>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════
// QUIZ_DATA 형식:
// [유형("A"|"B"), 번호, 문제텍스트, 선택지1, 선택지2, 선택지3, 선택지4, 정답(1~4)]
//
// A유형: 빈칸(_______)에 들어갈 표현을 4지선다로 고르기
// B유형: 4개 조각을 문장 순서에 맞게 배열할 때 ★ 위치의 조각 고르기
// ════════════════════════════════════════════════════
const QUIZ_DATA = [
["A", 1, "二度とあの部屋に入らないと約束しろ _______ 言われたけど、僕は約束しなかった。", "を", "って", "のを", "だ", 2],
["A", 2, "私は何百回もこの手紙を読み返した。そして読み返す　_______ たまらなく哀しい気持になった。", "うちに", "はじめに", "たびに", "だけに", 3],
["A", 3, "本を読んでいたら、　_______ 五時間も経ってしまった。", "そろそろ", "だんだん", "ようやく", "いつの間にか", 4],
["A", 4, "ふたりはそれから３０年あまり、死がふたりを分かつまで幸せな結婚生活を送る　_______ 。", "ことだ", "ことになった", "ことにした", "ようになった", 2],
["A", 5, "彼女が蛇口をあけ、僕の傷ついた前腕を氷　_______ 冷たい水の下へ導いた。", "のように", "みたいに", "のときに", "そうに", 1],
["A", 6, "まさかあのふたり　_______ なにかあったと言いたいんじゃないだろうな！", "の間と", "の間の", "の間に", "の間で", 3],
["A", 7, "鍵はお客様のお部屋のテーブルの上に　_______ 。", "ございます", "いらっしゃいます", "いる", "おります", 1],
["A", 8, "あなた　_______ ちょっと内密で話したいことがあるのですが…", "だけ", "だけで", "だけを", "だけに", 4],
["A", 9, "勉強して、ある程度日本が話せる　_______ 日本語の授業がおもしろくなった。", "ことができるまで", "ことができてから", "ようになるまで", "ようになってから", 4],
["A", 10, "A社の商品が腰の痛みにどのくらい効果が　_______ 詳しく知りたい。", "あるのかによって", "あるのかについて", "あるのかどうかによって", "あるのかどうかについて", 2],
["A", 11, "あなたのお父さんもきっと彼を助けた _______ 。", "による", "にすぎない", "に違いない", "には限らない", 3],
["A", 12, "表紙 _______ 、この演目はシェイクスピアの「真夏の夜の夢」で、上演されたのは三十四年ほど前だ。", "にしては", "によると", "にかけて", "に関する", 2],
["A", 13, "きみは十八歳になる。これは大事なことだ。法律的に成人になる _______ から。", "という", "ものだ", "ことだ", "わけだ", 4],
["A", 14, "多くの賞金を得るために、彼は自分の妻 _______ 多くの同志を売りました。", "にむけて", "をはじめ", "につれて", "とともに", 2],
["A", 15, "これに _______ 会社のイメージは著しく傷ついた。", "によって", "になって", "にとって", "について", 1],
["A", 16, "鈴木はその場で目をつぶり、気を _______ のか、ゆっくりと大きく息をついた。", "静めようとした", "静めようとしている", "静めるようにしている", "静めるようにした", 2],

["B", 248, "最近は　_______　　_______　…★… _______　レストランでのマナーが悪い。", "ばかりか", "親", "子供", "までも", 2],
["B", 249, "先生　「調べた結果を説明するときは、　_______　　_______　…★… _______　なります。", "わかりやすく", "示しながら", "表やグラフを", "説明すると", 4],
["A", 250, "「君は暑さ　_______　弱いでしょ。今日は外出するのをやめておこう。」 「それはだめ。せっかくのゴールデンウィークなんだから。」", "で", "が", "を", "に", 4],
["A", 251, "このマンションは、駅に近い　_______　価格が高い。", "ために", "ように", "によって", "おかげで", 1],
["A", 252, "子供のとき、よくこの川で遊んだ　_______　です。", "ところ", "こと", "もの", "ものだ", 3],
["A", 253, "A「このチョコレートは星の形　_______　していて、可愛いですね。」 B「へえ、ほんとうだ。」", "を", "が", "に", "と", 1],
["A", 254, "久しぶりに実家に帰ったが、隣のおばあちゃんはもう８０歳近いということを　_______　ほど元気だった。", "感じられる", "感じられない", "感じさせる", "感じさせない", 4],
["A", 255, "リンさんはうれしさの　_______　泣き出してしまった。", "あまり", "のこり", "わけて", "おかげ", 1],
["A", 256, "木村　「山田さんのそのネックレスがかわいいですね、どこで買ったんですか？」 山田　「ああ、これは　_______　、自分で作ったんです。」", "買わなくて", "買ったんじゃなくて", "買うものではなく", "買ったものじゃない", 2],
["A", 257, "ピアノを練習している　_______　、上手になりました。", "あいだに", "うちに", "場合に", "ところに", 2],
["A", 258, "海外旅行は無理だとしても温泉　_______　行きたいわ。", "ぐらい", "ほど", "しか", "ばかり", 1],
["A", 259, "ニュースで聞いたのですが、来年タクシーの運賃が上げされるという　_______　ですよ。", "もの", "ところ", "こと", "はず", 3],
];

const TYPE_LABELS = { A: '유형 A · 빈칸 채우기', B: '유형 B · ★ 위치 고르기' };

let selectedType = 'A';
let TIMER_SEC = 0;
let questions = [];
let answers = [];
let current = 0, totalQ = 0;
let timerInterval = null, timeLeft = 0, isPaused = false, answered = false;

// ── 유형 선택 ──
function selectType(type) {
  selectedType = type;
  document.querySelectorAll('.type-btn').forEach(btn => {
    btn.classList.toggle('selected', btn.dataset.type === type);
  });
  updateTotalCount();
}

function updateTotalCount() {
  const n = QUIZ_DATA.filter(q => q[0] === selectedType).length;
  document.getElementById('totalCount').textContent = n;
}

document.addEventListener('DOMContentLoaded', () => {
  updateTotalCount();
  document.getElementById('countInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') startQuiz();
  });
});

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 선택지 셔플 + 정답 위치 재계산
function buildShuffledChoices(q) {
  const original = [
    { text: q[3], origIdx: 0 },
    { text: q[4], origIdx: 1 },
    { text: q[5], origIdx: 2 },
    { text: q[6], origIdx: 3 },
  ];
  const correctOrigIdx = q[7] - 1; // 0-based
  const shuffled = shuffle(original);
  const shuffledAnswer = shuffled.findIndex(c => c.origIdx === correctOrigIdx) + 1;
  return { shuffledChoices: shuffled.map(c => c.text), shuffledAnswer };
}

function startQuiz() {
  const filtered = QUIZ_DATA.filter(q => q[0] === selectedType);
  if (filtered.length === 0) {
    alert('선택한 유형의 문제가 없습니다.');
    return;
  }
  const n = parseInt(document.getElementById('countInput').value);
  if (!n || n < 1) { alert('문제 수를 입력해주세요.'); return; }
  if (n > filtered.length) {
    alert(`해당 유형의 문제가 ${filtered.length}개입니다.\n${filtered.length} 이하로 입력해주세요.`);
    return;
  }
  const t = parseInt(document.getElementById('timerInput').value);
  if (isNaN(t) || t < 0) { alert('제한 시간을 올바르게 입력해주세요.'); return; }
  TIMER_SEC = t;
  totalQ = n;

  const rawQ = shuffle(filtered).slice(0, n);
  questions = rawQ.map(q => {
    const { shuffledChoices, shuffledAnswer } = buildShuffledChoices(q);
    return { q, shuffledChoices, shuffledAnswer };
  });
  answers = [];
  current = 0;
  showScreen('quizScreen');
  loadQuestion();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function loadQuestion() {
  if (current >= totalQ) { endQuiz(); return; }
  answered = false;

  const { q, shuffledChoices } = questions[current];
  const isB = q[0] === 'B';

  // 뱃지
  const badge = document.getElementById('questionTypeBadge');
  badge.textContent = TYPE_LABELS[q[0]];
  badge.className = 'question-type-badge ' + (isB ? 'type-b' : 'type-a');

  // B유형 안내 표시
  document.getElementById('bHint').style.display = isB ? 'block' : 'none';

  // 문제 텍스트: B유형은 빈칸 표기를 정리해서 표시
  let qText = q[2];
  if (isB) {
    // _______　_______　…★… _______ 패턴을 읽기 쉽게 정리
    qText = qText
      .replace(/[　\s]*_+[　\s]*/g, ' __ ')
      .replace(/…★…/g, '…★…')
      .trim();
  }
  document.getElementById('questionText').textContent = qText;
  document.getElementById('progressText').textContent = `${current + 1} / ${totalQ}`;

  const grid = document.getElementById('choicesGrid');
  const btns = grid.querySelectorAll('.choice-btn');
  btns.forEach((btn, i) => {
    btn.className = 'choice-btn';
    btn.disabled = false;
    btn.querySelector('.choice-num').textContent = i + 1;
    btn.querySelector('.choice-text').textContent = shuffledChoices[i];
  });

  if (TIMER_SEC > 0) {
    document.getElementById('timerBarWrap').style.display = '';
    document.getElementById('timerCount').style.display = '';
    startTimer();
  } else {
    document.getElementById('timerBarWrap').style.display = 'none';
    document.getElementById('timerCount').style.display = 'none';
  }
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = TIMER_SEC;
  updateTimerUI();
  timerInterval = setInterval(() => {
    if (isPaused) return;
    timeLeft -= 0.1;
    if (timeLeft <= 0) {
      timeLeft = 0; updateTimerUI(); clearInterval(timerInterval);
      recordAnswer(-1);
    } else { updateTimerUI(); }
  }, 100);
}

function updateTimerUI() {
  const pct = (timeLeft / TIMER_SEC) * 100;
  const bar = document.getElementById('timerBar');
  bar.style.width = pct + '%';
  bar.style.background = pct > 60 ? 'var(--timer-full)' : pct > 30 ? 'var(--timer-mid)' : 'var(--timer-low)';
  document.getElementById('timerCount').textContent = Math.ceil(timeLeft) + '초';
}

function selectChoice(idx) {
  if (isPaused || answered) return;
  answered = true;
  clearInterval(timerInterval);
  const btns = document.getElementById('choicesGrid').querySelectorAll('.choice-btn');
  btns.forEach(btn => btn.disabled = true);
  btns[idx].classList.add('selected-pending');
  recordAnswer(idx + 1);
}

function skipQuestion() {
  if (isPaused || answered) return;
  answered = true;
  clearInterval(timerInterval);
  recordAnswer(-1);
}

function recordAnswer(chosen) {
  answers.push({ ...questions[current], chosen });
  setTimeout(() => { current++; loadQuestion(); }, 180);
}

function togglePause() {
  isPaused = !isPaused;
  const overlay = document.getElementById('pauseOverlay');
  const btn = document.getElementById('pauseBtn');
  if (isPaused) {
    overlay.classList.add('show'); btn.classList.add('paused'); btn.textContent = '계속하기';
  } else {
    overlay.classList.remove('show'); btn.classList.remove('paused'); btn.textContent = '일시정지';
  }
}

function switchTab(tab) {
  const isWrong = tab === 'wrong';
  document.getElementById('tabWrongBtn').classList.toggle('active', isWrong);
  document.getElementById('tabCorrectBtn').classList.toggle('active', !isWrong);
  document.getElementById('panelWrong').classList.toggle('active', isWrong);
  document.getElementById('panelCorrect').classList.toggle('active', !isWrong);
}

function endQuiz() {
  clearInterval(timerInterval);
  showScreen('resultScreen');

  const correctList = answers.filter(a => a.chosen === a.shuffledAnswer);
  const wrongList   = answers.filter(a => a.chosen !== a.shuffledAnswer);
  const pct = Math.round((correctList.length / totalQ) * 100);

  document.getElementById('scoreNum').textContent = correctList.length;
  document.getElementById('scoreTotal').textContent = `/ ${totalQ}`;
  document.getElementById('scorePct').textContent = `정답률 ${pct}%`;
  document.getElementById('wrongCount').textContent = `(${wrongList.length})`;
  document.getElementById('correctCount').textContent = `(${correctList.length})`;

  // 오답
  const wEl = document.getElementById('wrongList');
  wEl.innerHTML = '';
  if (wrongList.length === 0) {
    wEl.innerHTML = '<li class="empty-msg">오답 없음 🎉</li>';
  } else {
    wrongList.forEach(({ q, shuffledChoices, shuffledAnswer, chosen }) => {
      const isB = q[0] === 'B';
      const myAns = chosen >= 1
        ? `<span class="item-mine">➜ ${chosen}번 「${esc(shuffledChoices[chosen-1])}」</span>`
        : `<span class="item-skipped">건너뜀 / 시간초과</span>`;
      wEl.innerHTML += `
        <li class="wrong-item">
          <div class="wrong-item-header">
            <span class="wrong-q-badge ${isB ? 'type-b' : 'type-a'}">${q[0]}</span>
            <span class="wrong-q-num">#${q[1]}</span>
            <span class="wrong-q-text">${esc(q[2])}</span>
          </div>
          <div class="wrong-answers-row"><span class="item-label">내 답</span>${myAns}</div>
          <div class="wrong-answers-row">
            <span class="item-label">정답</span>
            <span class="item-correct">${shuffledAnswer}번 「${esc(shuffledChoices[shuffledAnswer-1])}」</span>
          </div>
        </li>`;
    });
  }

  // 정답
  const cEl = document.getElementById('correctList');
  cEl.innerHTML = '';
  if (correctList.length === 0) {
    cEl.innerHTML = '<li class="empty-msg">정답 없음</li>';
  } else {
    correctList.forEach(({ q, shuffledChoices, shuffledAnswer }) => {
      const isB = q[0] === 'B';
      cEl.innerHTML += `
        <li class="correct-item">
          <span class="correct-q-badge ${isB ? 'type-b' : 'type-a'}">${q[0]}</span>
          <div class="correct-detail">
            <div class="correct-q-text">${esc(q[2])}</div>
            <span class="correct-ans">${shuffledAnswer}번 「${esc(shuffledChoices[shuffledAnswer-1])}」</span>
          </div>
        </li>`;
    });
  }

  switchTab('wrong');
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function restart() {
  isPaused = false;
  clearInterval(timerInterval);
  document.getElementById('pauseOverlay').classList.remove('show');
  document.getElementById('pauseBtn').classList.remove('paused');
  document.getElementById('pauseBtn').textContent = '일시정지';
  showScreen('startScreen');
  updateTotalCount();
}
</script>
