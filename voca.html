<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일본어 어휘 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --border: #e8e6e0;
    --text: #1a1917;
    --text-muted: #8a8780;
    --accent: #3d6b4f;
    --accent-light: #eaf2ed;
    --danger: #c0392b;
    --danger-light: #fdf0ee;
    --timer-full: #3d6b4f;
    --timer-mid: #e67e22;
    --timer-low: #c0392b;
    --radius: 12px;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .screen { display: none; width: 100%; max-width: 580px; }
  .screen.active { display: block; }

  /* ── START ── */
  .start-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 48px 40px;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .start-card h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 1.6rem; font-weight: 700;
    letter-spacing: 2px; margin-bottom: 6px;
  }
  .start-card > p { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 32px; }

  .section-label {
    font-size: 0.75rem; font-weight: 700; color: var(--text-muted);
    letter-spacing: 1.5px; text-transform: uppercase;
    text-align: left; margin-bottom: 10px; margin-top: 24px;
  }

  /* 유형 선택 */
  .type-select-group {
    display: flex; gap: 8px; margin-bottom: 16px;
  }
  .type-btn {
    flex: 1; padding: 14px 8px; border: 1.5px solid var(--border); border-radius: 8px;
    background: var(--bg); cursor: pointer; transition: all 0.15s;
    font-family: 'Noto Sans KR', sans-serif; text-align: center;
  }
  .type-btn:hover { border-color: var(--accent); }
  .type-btn.selected { border-color: var(--accent); background: var(--accent-light); }
  .type-btn .type-code {
    font-family: 'DM Mono', monospace; font-size: 1.1rem; font-weight: 700;
    color: var(--accent); display: block; margin-bottom: 4px;
  }
  .type-btn .type-desc {
    font-size: 0.68rem; color: var(--text-muted); line-height: 1.4;
  }
  .type-btn.selected .type-desc { color: var(--accent); }

  .input-group { text-align: left; margin-bottom: 12px; }
  .input-group label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 0.3px; }
  .input-group input[type="number"] {
    width: 100%; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 8px;
    font-size: 1rem; font-family: 'DM Mono', monospace; color: var(--text); background: var(--bg);
    outline: none; transition: border-color 0.15s;
  }
  .input-group input[type="number"]:focus { border-color: var(--accent); }

  .hint { font-size: 0.78rem; color: var(--text-muted); margin: 16px 0 24px; text-align: left; }
  .hint span { font-family: 'DM Mono', monospace; font-weight: 500; }

  .btn-start {
    width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none;
    border-radius: 8px; font-size: 0.95rem; font-weight: 600; font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer; transition: opacity 0.15s, transform 0.1s;
  }
  .btn-start:hover { opacity: 0.9; }
  .btn-start:active { transform: scale(0.99); }

  /* ── QUIZ ── */
  .quiz-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .progress-text { font-family: 'DM Mono', monospace; font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }

  .quiz-header-right { display: flex; align-items: center; gap: 8px; }

  .btn-pause {
    padding: 7px 16px; background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 0.85rem; font-weight: 600; font-family: 'Noto Sans KR', sans-serif;
    color: var(--text); cursor: pointer; transition: background 0.15s, border-color 0.15s; min-width: 76px;
  }
  .btn-pause:hover { background: var(--border); }
  .btn-pause.paused { background: var(--accent); color: #fff; border-color: var(--accent); }

  .timer-bar-wrap { height: 5px; background: var(--border); border-radius: 99px; margin-bottom: 24px; overflow: hidden; }
  .timer-bar { height: 100%; border-radius: 99px; transition: width 0.1s linear, background 0.3s; background: var(--timer-full); }

  /* 문제 유형 뱃지 */
  .question-type-badge {
    display: inline-block; font-size: 0.7rem; font-weight: 700; font-family: 'DM Mono', monospace;
    color: var(--accent); background: var(--accent-light); border-radius: 4px;
    padding: 2px 8px; letter-spacing: 1px; margin-bottom: 12px;
  }

  .word-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 36px 36px 28px; box-shadow: var(--shadow); margin-bottom: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }

  .question-text {
    font-family: 'Noto Serif JP', serif;
    font-size: 1.25rem; font-weight: 400; line-height: 1.9;
    letter-spacing: 0.5px; word-break: break-word;
    max-width: 100%;
  }

  .timer-count { font-family: 'DM Mono', monospace; font-size: 0.8rem; color: var(--text-muted); margin-top: 16px; }

  /* 4지선다 - 기본 2열 (A/B형) */
  .choices-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px;
  }
  /* C형: 1열 세로 나열 */
  .choices-grid.layout-vertical {
    grid-template-columns: 1fr;
  }
  .choice-btn {
    padding: 14px 16px; border: 1.5px solid var(--border); border-radius: 8px;
    background: var(--surface); cursor: pointer; text-align: left;
    font-family: 'Noto Serif JP', serif; font-size: 1rem;
    color: var(--text); transition: all 0.15s; display: flex; align-items: center; gap: 10px;
  }
  /* C형 세로 배치일 때 선택지 텍스트 정렬 */
  .layout-vertical .choice-btn {
    align-items: flex-start;
  }
  .choice-btn:hover { border-color: var(--accent); background: var(--accent-light); }
  .choice-btn:disabled { cursor: not-allowed; opacity: 0.7; }
  /* 선택했지만 정오답 미공개 — 단순 선택 표시 */
  .choice-btn.selected-pending { border-color: var(--accent); background: var(--accent-light); }

  .choice-num {
    font-family: 'DM Mono', monospace; font-size: 0.75rem; font-weight: 700;
    color: var(--text-muted); flex-shrink: 0;
    width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .choice-btn.selected-pending .choice-num { border-color: var(--accent); color: var(--accent); }

  .quiz-action-bar {
    display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px;
  }
  .btn-skip {
    padding: 11px 20px; background: var(--bg); color: var(--text-muted); border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 0.82rem; font-weight: 600; font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer; white-space: nowrap; transition: opacity 0.15s, background 0.15s;
  }
  .btn-skip:hover { background: var(--border); }

  /* ── PAUSE OVERLAY ── */
  .pause-overlay {
    display: none; position: fixed; inset: 0; background: rgba(247,246,243,0.88);
    backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px; text-align: center;
  }
  .pause-overlay.show { display: flex; }
  .pause-overlay h2 { font-size: 1.4rem; font-weight: 700; }
  .pause-overlay p { color: var(--text-muted); font-size: 0.875rem; }
  .btn-resume {
    padding: 13px 32px; background: var(--accent); color: #fff; border: none;
    border-radius: 8px; font-size: 0.95rem; font-weight: 600; font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer; transition: opacity 0.15s; margin-top: 8px;
  }
  .btn-resume:hover { opacity: 0.88; }

  /* ── RESULT ── */
  .result-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 40px; box-shadow: var(--shadow);
  }
  .result-summary { text-align: center; margin-bottom: 32px; }
  .result-summary h2 { font-size: 1.4rem; font-weight: 700; margin-bottom: 12px; }
  .score-display { display: inline-flex; align-items: baseline; gap: 4px; font-family: 'DM Mono', monospace; margin-bottom: 10px; }
  .score-num { font-size: 3rem; font-weight: 500; color: var(--accent); line-height: 1; }
  .score-total { font-size: 1.2rem; color: var(--text-muted); }
  .score-pct { font-family: 'DM Mono', monospace; font-size: 0.9rem; color: var(--text-muted); }

  .tab-bar { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
  .tab-btn {
    padding: 9px 20px; border: none; background: none; font-size: 0.85rem; font-weight: 600;
    font-family: 'Noto Sans KR', sans-serif; color: var(--text-muted); cursor: pointer;
    border-bottom: 2.5px solid transparent; margin-bottom: -2px; transition: color 0.15s, border-color 0.15s;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.tab-wrong.active { color: var(--danger); border-bottom-color: var(--danger); }
  .tab-btn.tab-correct.active { color: var(--accent); border-bottom-color: var(--accent); }

  .tab-panel { display: none; max-height: 400px; overflow-y: auto; margin-bottom: 24px; }
  .tab-panel.active { display: block; }

  .result-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }

  /* 오답 카드 */
  .wrong-item {
    padding: 14px 16px; border-radius: 8px; background: var(--danger-light);
    font-size: 0.83rem; line-height: 1.6;
  }
  .wrong-item-header {
    display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px;
  }
  .wrong-q-num {
    font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--danger);
    background: #f9d6d2; border-radius: 4px; padding: 1px 6px; flex-shrink: 0; margin-top: 2px;
  }
  .wrong-q-text {
    font-family: 'Noto Serif JP', serif; font-size: 0.9rem; color: var(--text); line-height: 1.6;
  }
  .wrong-answers-row { display: flex; gap: 16px; font-size: 0.78rem; }
  .item-label { color: var(--text-muted); min-width: 40px; }
  .item-correct { color: var(--accent); font-weight: 600; }
  .item-mine { color: var(--danger); }
  .item-skipped { color: var(--text-muted); font-style: italic; }

  /* 정답 카드 */
  .correct-item {
    padding: 12px 16px; border-radius: 8px; background: var(--accent-light);
    display: flex; align-items: flex-start; gap: 10px;
  }
  .correct-q-num {
    font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--accent);
    background: #d0e8da; border-radius: 4px; padding: 1px 6px; flex-shrink: 0; margin-top: 2px;
  }
  .correct-detail { font-size: 0.82rem; }
  .correct-q-text { font-family: 'Noto Serif JP', serif; font-size: 0.88rem; line-height: 1.5; margin-bottom: 4px; }
  .correct-ans { color: var(--accent); font-weight: 600; }

  .empty-msg { font-size: 0.82rem; color: var(--text-muted); font-style: italic; padding: 6px 0; }

  .btn-restart {
    width: 100%; padding: 13px; background: var(--accent); color: #fff; border: none;
    border-radius: 8px; font-size: 0.9rem; font-weight: 600; font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer; transition: opacity 0.15s;
  }
  .btn-restart:hover { opacity: 0.88; }

  @media (max-width: 480px) {
    .start-card { padding: 32px 20px; }
    .word-card { padding: 28px 20px 24px; }
    .question-text { font-size: 1.1rem; }
    .result-card { padding: 28px 20px; }
    .choices-grid { grid-template-columns: 1fr; }
    .type-btn .type-desc { font-size: 0.63rem; }
  }
</style>
</head>
<body>

<!-- ── START SCREEN ── -->
<div id="startScreen" class="screen active">
  <div class="start-card">
    <h1>일본어 어휘 퀴즈</h1>
    <p>유형과 문제 수를 선택하고 시작하세요</p>

    <div class="section-label">문제 유형</div>
    <div class="type-select-group">
      <div class="type-btn selected" data-type="A" onclick="selectType('A')">
        <span class="type-code">A</span>
        <span class="type-desc">빈칸에 들어갈<br>단어 고르기</span>
      </div>
      <div class="type-btn" data-type="B" onclick="selectType('B')">
        <span class="type-code">B</span>
        <span class="type-desc">유사한 의미의<br>단어 고르기</span>
      </div>
      <div class="type-btn" data-type="C" onclick="selectType('C')">
        <span class="type-code">C</span>
        <span class="type-desc">단어의 쓰임이<br>옳은 것 고르기</span>
      </div>
    </div>

    <div class="section-label">문제 설정</div>

    <div class="input-group">
      <label>풀 문제 수</label>
      <input type="number" id="countInput" min="1" value="10" placeholder="예: 10">
    </div>
    <div class="input-group">
      <label>문제당 제한 시간 (초) — 0 입력 시 무제한</label>
      <input type="number" id="timerInput" min="0" max="300" value="0" placeholder="0 = 무제한">
    </div>

    <p class="hint">선택된 유형의 문제 수: <span id="totalCount">0</span>개</p>
    <button class="btn-start" onclick="startQuiz()">시작하기</button>
  </div>
</div>

<!-- ── QUIZ SCREEN ── -->
<div id="quizScreen" class="screen">
  <div class="quiz-header">
    <span class="progress-text" id="progressText">1 / 10</span>
    <div class="quiz-header-right">
      <button class="btn-pause" id="pauseBtn" onclick="togglePause()">일시정지</button>
    </div>
  </div>

  <div class="timer-bar-wrap" id="timerBarWrap" style="display:none">
    <div class="timer-bar" id="timerBar" style="width:100%"></div>
  </div>

  <div class="word-card">
    <div class="question-type-badge" id="questionTypeBadge">유형 A</div>
    <div class="question-text" id="questionText">문제가 여기에 표시됩니다.</div>
    <div class="timer-count" id="timerCount" style="display:none"></div>
  </div>

  <div class="choices-grid" id="choicesGrid">
    <button class="choice-btn" onclick="selectChoice(0)"><span class="choice-num">1</span><span class="choice-text" id="choice0"></span></button>
    <button class="choice-btn" onclick="selectChoice(1)"><span class="choice-num">2</span><span class="choice-text" id="choice1"></span></button>
    <button class="choice-btn" onclick="selectChoice(2)"><span class="choice-num">3</span><span class="choice-text" id="choice2"></span></button>
    <button class="choice-btn" onclick="selectChoice(3)"><span class="choice-num">4</span><span class="choice-text" id="choice3"></span></button>
  </div>

  <div class="quiz-action-bar">
    <button class="btn-skip" id="skipBtn" onclick="skipQuestion()">건너뛰기</button>
  </div>
</div>

<!-- ── PAUSE OVERLAY ── -->
<div class="pause-overlay" id="pauseOverlay">
  <h2>일시정지</h2>
  <p>퀴즈가 멈춰 있습니다</p>
  <button class="btn-resume" onclick="togglePause()">계속하기</button>
</div>

<!-- ── RESULT SCREEN ── -->
<div id="resultScreen" class="screen">
  <div class="result-card">
    <div class="result-summary">
      <h2>결과</h2>
      <div class="score-display">
        <span class="score-num" id="scoreNum">0</span>
        <span class="score-total" id="scoreTotal">/ 0</span>
      </div>
      <div class="score-pct" id="scorePct"></div>
    </div>

    <div class="tab-bar">
      <button class="tab-btn tab-wrong active" id="tabWrongBtn" onclick="switchTab('wrong')">
        오답 <span id="wrongCount"></span>
      </button>
      <button class="tab-btn tab-correct" id="tabCorrectBtn" onclick="switchTab('correct')">
        정답 <span id="correctCount"></span>
      </button>
    </div>

    <div class="tab-panel active" id="panelWrong">
      <ul class="result-list" id="wrongList"></ul>
    </div>
    <div class="tab-panel" id="panelCorrect">
      <ul class="result-list" id="correctList"></ul>
    </div>

    <button class="btn-restart" onclick="restart()">다시 시작</button>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════
// QUIZ_DATA 형식:
// [유형("A"|"B"|"C"), 챕터번호, 문제번호, 문제텍스트, 선택지1, 선택지2, 선택지3, 선택지4, 정답(1~4)]
//
// 스프레드시트 J열 수식 (2행 기준):
// =""""&A2&""","&B2&","&C2&","""&SUBSTITUTE(D2,"""","\"\"")&""","""&E2&""","""&F2&""","""&G2&""","""&H2&""","&I2&"],"
//
// 위 수식이 출력하는 예시:
// ["B",2,4,"特に懸念されている点の一つは、市場が「拡大」することだ。","成長","拡張","発展","進化",2],
//
// 아래 QUIZ_DATA 배열에 스프레드시트에서 추출한 데이터를 붙여넣으세요.
const QUIZ_DATA = [
  // ── 유형 A 예시 (빈칸) ──
  ["A",1,1," _______ な資金は、安定した経営、さらに事業拡大できるチャンスにつながります。","豊富","贅沢","幸福","多量",1],
["A",1,2,"シジンは真面目な時は本当に真面目なのですが、ちゃっかりした面や、_______ が好きな面もあり、それも私と似ているかもしれません。","評判","快適","確認","冗談",4],
["A",1,3,"受話器を置いた大統領は、前進する _______ ができていた。","覚悟","感覚","発覚","自覚",1],
["A",1,4,"僕はすばらしいデザインを見れば元気になるし、_______ 工程のわずかな違いにまでこだわる。","造作","製造","創造","製品",2],
["A",1,5,"彼がここに電話をかけてきたのは単なる _______ の一致かもしれない。","自然","天然","突然","偶然",4],
["A",1,6,"資金の _______ を突き止めれば、テロリストを突き止め、制圧することができる。","連れ","哀れ","流れ","恐れ",3],
["A",1,7,"私は農家の長男なのですが、父が商業高校への _______ を勧めてくれたのです。","通学","進学","留学","奨学",2],
["A",1,8,"後輩に仕事のやり方について _______ をしました。","アイデア","アドバイス","デザイン","イメージ",2],
["A",1,9,"セミナーに参加したい人は、_______ に住所、氏名、希望日を書いてください。","証明書","領収書","申込書","参考書",3],
["A",1,10,"私は、外国語を１日で _______ マスターしたい。","完成","完了","完全","完璧",3],
["A",1,11,"彼が何を言っているのか、_______ わからない。","ぐっすり","すっきり","のんびり","さっぱり",4],
["A",1,12,"楽しみにしていたコンサートが中止になって _______ した。","はらはら","うっかり","どきどき","がっかり",4],
["B",2,1,"店の「手前に銀行がある。","オーバー","コスト","エネルギー","グランド",2],
["B",2,2,"わたしはこの馬の美しさに魅せられ、「帰宅」してからインターネットで調べてみた。","家に帰る","会社に行く","国に戻る","学校に通う",1],
["B",2,3,"あれは僕が「望む」仕事ではなかった。個人に製品を売れない状況に、本当に気が滅入ってしまった。","願う","祈る","想う","図る",1],
["B",2,4,"特に懸念されている点の一つは、市場が「拡大」することだ。","成長","拡張","発展","進化",2],

const TYPE_LABELS = {
  A: '유형 A · 빈칸 채우기',
  B: '유형 B · 유사어 고르기',
  C: '유형 C · 용법 고르기',
};

let TIMER_SEC = 0;
let selectedType = 'A';
let filteredData = [];
let questions = []; // 각 원소: { q, shuffledChoices, shuffledAnswer }
let current = 0;
let answers = []; // { q, shuffledChoices, shuffledAnswer, chosen(-1=skip, 1~4=셔플기준) }
let timerInterval = null, timeLeft = 0, isPaused = false, totalQ = 0;
let answered = false;

// ── 유형 선택 ──
function selectType(type) {
  selectedType = type;
  document.querySelectorAll('.type-btn').forEach(btn => {
    btn.classList.toggle('selected', btn.dataset.type === type);
  });
  updateTotalCount();
}

function updateTotalCount() {
  const filtered = QUIZ_DATA.filter(q => q[0] === selectedType);
  document.getElementById('totalCount').textContent = filtered.length;
}

document.addEventListener('DOMContentLoaded', () => {
  updateTotalCount();
  document.getElementById('countInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') startQuiz();
  });
});

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 선택지 셔플 + 정답 인덱스 재계산
function buildShuffledChoices(q) {
  // 원본 선택지: 인덱스 0~3 = 1~4번
  const original = [
    { text: q[4], origIdx: 0 },
    { text: q[5], origIdx: 1 },
    { text: q[6], origIdx: 2 },
    { text: q[7], origIdx: 3 },
  ];
  const correctOrigIdx = q[8] - 1; // 0-based
  const shuffled = shuffle(original);
  // 셔플 후 정답이 몇 번째(1-based)에 위치하는지
  const shuffledAnswer = shuffled.findIndex(c => c.origIdx === correctOrigIdx) + 1;
  return { shuffledChoices: shuffled.map(c => c.text), shuffledAnswer };
}

function startQuiz() {
  filteredData = QUIZ_DATA.filter(q => q[0] === selectedType);
  if (filteredData.length === 0) {
    alert('선택한 유형의 문제가 없습니다.\nQUIZ_DATA에 데이터를 추가해주세요.');
    return;
  }
  const n = parseInt(document.getElementById('countInput').value);
  if (!n || n < 1) { alert('문제 수를 입력해주세요.'); return; }
  const maxN = filteredData.length;
  if (n > maxN) {
    alert(`해당 유형의 문제가 ${maxN}개입니다.\n${maxN} 이하로 입력해주세요.`);
    return;
  }
  const t = parseInt(document.getElementById('timerInput').value);
  if (isNaN(t) || t < 0) { alert('제한 시간을 올바르게 입력해주세요.'); return; }
  TIMER_SEC = t;

  totalQ = n;
  // 문제 순서 셔플 후 선택지도 각각 셔플
  const rawQuestions = shuffle(filteredData).slice(0, n);
  questions = rawQuestions.map(q => {
    const { shuffledChoices, shuffledAnswer } = buildShuffledChoices(q);
    return { q, shuffledChoices, shuffledAnswer };
  });

  current = 0;
  answers = [];
  showScreen('quizScreen');
  loadQuestion();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function loadQuestion() {
  if (current >= totalQ) { endQuiz(); return; }
  answered = false;

  const { q, shuffledChoices } = questions[current];

  document.getElementById('questionTypeBadge').textContent = TYPE_LABELS[q[0]];
  // 빈칸은 원문 그대로 표시 (하이라이트 없음)
  document.getElementById('questionText').textContent = q[3];
  document.getElementById('progressText').textContent = `${current + 1} / ${totalQ}`;

  // C형 여부에 따라 그리드 레이아웃 전환
  const grid = document.getElementById('choicesGrid');
  if (q[0] === 'C') {
    grid.classList.add('layout-vertical');
  } else {
    grid.classList.remove('layout-vertical');
  }

  // 셔플된 선택지 표시
  const btns = grid.querySelectorAll('.choice-btn');
  btns.forEach((btn, i) => {
    btn.className = 'choice-btn';
    btn.disabled = false;
    btn.querySelector('.choice-num').textContent = i + 1;
    btn.querySelector('.choice-text').textContent = shuffledChoices[i];
  });

  // 타이머
  if (TIMER_SEC > 0) {
    document.getElementById('timerBarWrap').style.display = '';
    document.getElementById('timerCount').style.display = '';
    startTimer();
  } else {
    document.getElementById('timerBarWrap').style.display = 'none';
    document.getElementById('timerCount').style.display = 'none';
  }
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = TIMER_SEC;
  updateTimerUI();
  timerInterval = setInterval(() => {
    if (isPaused) return;
    timeLeft -= 0.1;
    if (timeLeft <= 0) {
      timeLeft = 0; updateTimerUI(); clearInterval(timerInterval);
      recordAnswer(-1); // 시간 초과
    } else { updateTimerUI(); }
  }, 100);
}

function updateTimerUI() {
  const pct = (timeLeft / TIMER_SEC) * 100;
  const bar = document.getElementById('timerBar');
  bar.style.width = pct + '%';
  if (pct > 60) bar.style.background = 'var(--timer-full)';
  else if (pct > 30) bar.style.background = 'var(--timer-mid)';
  else bar.style.background = 'var(--timer-low)';
  document.getElementById('timerCount').textContent = Math.ceil(timeLeft) + '초';
}

// idx: 클릭한 버튼의 0-based 인덱스 → chosen은 1-based
function selectChoice(idx) {
  if (isPaused || answered) return;
  answered = true;
  clearInterval(timerInterval);

  // 선택한 버튼 시각적으로 표시 (정오답 미공개 — 단순 선택 표시)
  const btns = document.getElementById('choicesGrid').querySelectorAll('.choice-btn');
  btns.forEach(btn => btn.disabled = true);
  btns[idx].classList.add('selected-pending');

  recordAnswer(idx + 1); // 셔플 기준 1-based
}

function skipQuestion() {
  if (isPaused || answered) return;
  answered = true;
  clearInterval(timerInterval);
  recordAnswer(-1);
}

function recordAnswer(chosen) {
  // chosen: 셔플된 선택지 기준 1~4, -1은 건너뜀/시간초과
  const item = questions[current];
  answers.push({ ...item, chosen });

  // 정오답 표시 없이 즉시 다음 문제
  setTimeout(() => {
    current++;
    loadQuestion();
  }, 180);
}

function togglePause() {
  isPaused = !isPaused;
  const overlay = document.getElementById('pauseOverlay');
  const btn = document.getElementById('pauseBtn');
  if (isPaused) {
    overlay.classList.add('show');
    btn.classList.add('paused');
    btn.textContent = '계속하기';
  } else {
    overlay.classList.remove('show');
    btn.classList.remove('paused');
    btn.textContent = '일시정지';
  }
}

function switchTab(tab) {
  const isWrong = tab === 'wrong';
  document.getElementById('tabWrongBtn').classList.toggle('active', isWrong);
  document.getElementById('tabCorrectBtn').classList.toggle('active', !isWrong);
  document.getElementById('panelWrong').classList.toggle('active', isWrong);
  document.getElementById('panelCorrect').classList.toggle('active', !isWrong);
}

function endQuiz() {
  clearInterval(timerInterval);
  showScreen('resultScreen');

  const correctList = answers.filter(a => a.chosen === a.shuffledAnswer);
  const wrongList   = answers.filter(a => a.chosen !== a.shuffledAnswer);

  const pct = Math.round((correctList.length / totalQ) * 100);
  document.getElementById('scoreNum').textContent = correctList.length;
  document.getElementById('scoreTotal').textContent = `/ ${totalQ}`;
  document.getElementById('scorePct').textContent = `정답률 ${pct}%`;
  document.getElementById('wrongCount').textContent = `(${wrongList.length})`;
  document.getElementById('correctCount').textContent = `(${correctList.length})`;

  // ── 오답 리스트 ──
  const wListEl = document.getElementById('wrongList');
  wListEl.innerHTML = '';
  if (wrongList.length === 0) {
    wListEl.innerHTML = '<li class="empty-msg">오답 없음 🎉</li>';
  } else {
    wrongList.forEach(({ q, shuffledChoices, shuffledAnswer, chosen }) => {
      const myAnsText = chosen >= 1
        ? `<span class="item-mine">➜ ${chosen}번 「${esc(shuffledChoices[chosen-1])}」</span>`
        : `<span class="item-skipped">건너뜀 / 시간초과</span>`;
      const correctText = `${shuffledAnswer}번 「${esc(shuffledChoices[shuffledAnswer-1])}」`;

      wListEl.innerHTML += `
        <li class="wrong-item">
          <div class="wrong-item-header">
            <span class="wrong-q-num">Ch.${q[1]}-${q[2]}</span>
            <span class="wrong-q-text">${esc(q[3])}</span>
          </div>
          <div class="wrong-answers-row">
            <span class="item-label">내 답</span>${myAnsText}
          </div>
          <div class="wrong-answers-row">
            <span class="item-label">정답</span><span class="item-correct">${esc(correctText)}</span>
          </div>
        </li>`;
    });
  }

  // ── 정답 리스트 ──
  const cListEl = document.getElementById('correctList');
  cListEl.innerHTML = '';
  if (correctList.length === 0) {
    cListEl.innerHTML = '<li class="empty-msg">정답 없음</li>';
  } else {
    correctList.forEach(({ q, shuffledChoices, shuffledAnswer }) => {
      cListEl.innerHTML += `
        <li class="correct-item">
          <span class="correct-q-num">Ch.${q[1]}-${q[2]}</span>
          <div class="correct-detail">
            <div class="correct-q-text">${esc(q[3])}</div>
            <span class="correct-ans">${shuffledAnswer}번 「${esc(shuffledChoices[shuffledAnswer-1])}」</span>
          </div>
        </li>`;
    });
  }

  switchTab('wrong');
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function restart() {
  isPaused = false;
  clearInterval(timerInterval);
  document.getElementById('pauseOverlay').classList.remove('show');
  document.getElementById('pauseBtn').classList.remove('paused');
  document.getElementById('pauseBtn').textContent = '일시정지';
  showScreen('startScreen');
  updateTotalCount();
}
</script>
</body>
</html>
